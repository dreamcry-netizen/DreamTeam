name: Windows build, self-test and installer

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract uploaded source archive
        shell: pwsh
        run: |
          $zip = Get-ChildItem -File -Filter '*fixed-source-github-actions.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Source ZIP was not found in repository root.' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath .\_source -Force
          $root = Get-ChildItem .\_source -Directory | Select-Object -First 1
          if (-not $root) { throw 'Source archive has no root directory.' }
          Get-ChildItem $root.FullName -Force | ForEach-Object { Copy-Item $_.FullName . -Recurse -Force }
          Remove-Item .\_source -Recurse -Force
          Remove-Item $zip.FullName -Force

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425
          cache: true
          cache-dependency-path: PdfStudio/PdfStudio.csproj
      - name: Restore
        run: dotnet restore PdfStudio/PdfStudio.csproj --runtime win-x64
      - name: Publish self-contained single-file EXE
        run: >
          dotnet publish PdfStudio/PdfStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish --no-restore
      - name: Automatic PDF self-test
        shell: pwsh
        run: |
          & .\publish\PDF-Studio-CSharp.exe --self-test-auto
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package application
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $exe = "PDF-Studio-CSharp-$version-win-x64.exe"
          Move-Item .\publish\PDF-Studio-CSharp.exe ".\publish\$exe"
          Compress-Archive -Force -Path ".\publish\$exe" -DestinationPath ".\publish\PDF-Studio-CSharp-$version-win-x64.zip"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem .\publish -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object { $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash; "$hash  $($_.Name)" } | Set-Content .\publish\SHA256SUMS.txt
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-CSharp-win-x64
          path: |
            publish/*.exe
            publish/*.zip
            publish/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
name: Windows build, self-test and installer

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract uploaded source archive
        shell: pwsh
        run: |
          $zip = Get-ChildItem -File -Filter '*fixed-source-github-actions.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Source ZIP was not found in repository root.' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath .\_source -Force
          $root = Get-ChildItem .\_source -Directory | Select-Object -First 1
          if (-not $root) { throw 'Source archive has no root directory.' }
          Get-ChildItem $root.FullName -Force | ForEach-Object { Copy-Item $_.FullName . -Recurse -Force }
          Remove-Item .\_source -Recurse -Force
          Remove-Item $zip.FullName -Force

      - name: Patch OCR to prefer bundled Tesseract
        shell: pwsh
        run: |
          $file = 'PdfStudio\MainWindow.xaml.cs'
          $text = Get-Content $file -Raw
          if ($text -notmatch 'FileName\s*=\s*"tesseract"') { throw 'The expected Tesseract ProcessStartInfo was not found.' }
          $helper = @'
          private static string ResolveTesseractPath()
          {
              var candidates = new[]
              {
                  Path.Combine(AppContext.BaseDirectory, "ocr", "tesseract.exe"),
                  Path.Combine(AppContext.BaseDirectory, "tesseract.exe"),
                  Environment.GetEnvironmentVariable("TESSERACT_PATH")
              };
              foreach (var candidate in candidates)
              {
                  if (!string.IsNullOrWhiteSpace(candidate) && File.Exists(candidate)) return candidate;
              }
              return "tesseract";
          }

          '@
          if ($text -notmatch 'ResolveTesseractPath\(') {
            $text = [regex]::Replace($text, '(?m)^\s*(private\s+static\s+async\s+Task<string>\s+RunTesseractAsync\s*\()', $helper + '$1', 1)
          }
          $text = [regex]::Replace($text, 'FileName\s*=\s*"tesseract"', 'FileName = ResolveTesseractPath()', 1)
          Set-Content $file $text -Encoding UTF8
      - name: Restore
        run: dotnet restore PdfStudio/PdfStudio.csproj --runtime win-x64

      - name: Publish self-contained single-file EXE
        run: >
          dotnet publish PdfStudio/PdfStudio.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish --no-restore

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract --version=5.5.3.20260724 -y --no-progress
          $ocr = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          if (-not (Test-Path (Join-Path $ocr 'tesseract.exe'))) { throw "Tesseract executable not found in $ocr" }
          New-Item -ItemType Directory -Path .\publish\ocr -Force | Out-Null
          Copy-Item "$ocr\*" .\publish\ocr -Recurse -Force
          if (-not (Test-Path .\publish\ocr\tessdata\rus.traineddata)) { throw 'Russian OCR language data rus.traineddata is missing.' }
          if (-not (Test-Path .\publish\ocr\tessdata\eng.traineddata)) { throw 'English OCR language data eng.traineddata is missing.' }

      - name: Automatic PDF self-test
        shell: pwsh
        run: |
          & .\publish\PDF-Studio-CSharp.exe --self-test-auto
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: OCR smoke test
        shell: pwsh
        run: |
          & .\publish\ocr\tesseract.exe --version
          & .\publish\ocr\tesseract.exe --list-langs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare installer source
        shell: pwsh
        run: |
          $iss = 'installer.iss'
          $text = Get-Content $iss -Raw
          if (-not $text.Contains('Source: "publish\ocr\*";')) {
            $needle = 'Source: "publish\{#MyAppExe}"; DestDir: "{app}"; Flags: ignoreversion'
            $replacement = $needle + [Environment]::NewLine + 'Source: "publish\ocr\*"; DestDir: "{app}\ocr"; Flags: ignoreversion recursesubdirs createallsubdirs'
            if (-not $text.Contains($needle)) { throw 'Installer EXE source line was not found.' }
            $text = $text.Replace($needle, $replacement)
            Set-Content $iss $text -Encoding UTF8
          }

      - name: Package application with bundled OCR
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $exe = "PDF-Studio-CSharp-$version-win-x64.exe"
          Move-Item .\publish\PDF-Studio-CSharp.exe ".\publish\$exe"
          Compress-Archive -Force -Path ".\publish\*" -DestinationPath ".\publish\PDF-Studio-CSharp-$version-win-x64.zip"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          & (Join-Path $pf86 'Inno Setup 6\ISCC.exe') "/DMyAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem .\publish -File | Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object { $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash; "$hash  $($_.Name)" } |
            Set-Content .\publish\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-CSharp-win-x64
          path: |
            publish/*.exe
            publish/*.zip
            publish/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
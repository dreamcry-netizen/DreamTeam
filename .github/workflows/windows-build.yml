name: Windows build, self-test and installer

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract uploaded source archive
        shell: pwsh
        run: |
          $zip = Get-ChildItem -File -Filter '*fixed-source-github-actions.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Source ZIP was not found in repository root.' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath .\_source -Force
          $root = Get-ChildItem .\_source -Directory | Select-Object -First 1
          if (-not $root) { throw 'Source archive has no root directory.' }
          Get-ChildItem $root.FullName -Force | ForEach-Object { Copy-Item $_.FullName . -Recurse -Force }
          Remove-Item .\_source -Recurse -Force
          Remove-Item $zip.FullName -Force

      - name: Patch OCR resolver and version
        shell: pwsh
        run: |
          $file = 'PdfStudio\MainWindow.xaml.cs'
          if (-not (Test-Path $file)) { throw "OCR source file was not found: $file" }
          $text = Get-Content $file -Raw

          $helper = @'
          private static string ResolveTesseractPath()
          {
              var candidates = new List<string?>
              {
                  System.IO.Path.Combine(AppContext.BaseDirectory, "ocr", "tesseract.exe"),
                  System.IO.Path.Combine(AppContext.BaseDirectory, "tesseract.exe"),
                  Environment.GetEnvironmentVariable("TESSERACT_PATH"),
                  System.IO.Path.Combine(Environment.CurrentDirectory, "ocr", "tesseract.exe"),
                  System.IO.Path.Combine(Environment.CurrentDirectory, "tesseract.exe")
              };

              var programFiles = Environment.GetFolderPath(Environment.SpecialFolder.ProgramFiles);
              if (!string.IsNullOrWhiteSpace(programFiles))
                  candidates.Add(System.IO.Path.Combine(programFiles, "Tesseract-OCR", "tesseract.exe"));

              var programFilesX86 = Environment.GetFolderPath(Environment.SpecialFolder.ProgramFilesX86);
              if (!string.IsNullOrWhiteSpace(programFilesX86))
                  candidates.Add(System.IO.Path.Combine(programFilesX86, "Tesseract-OCR", "tesseract.exe"));

              var localAppData = Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData);
              if (!string.IsNullOrWhiteSpace(localAppData))
                  candidates.Add(System.IO.Path.Combine(localAppData, "Programs", "Tesseract-OCR", "tesseract.exe"));

              foreach (var candidate in candidates)
              {
                  if (string.IsNullOrWhiteSpace(candidate)) continue;
                  var normalized = candidate.Trim().Trim('"');
                  if (Directory.Exists(normalized))
                      normalized = System.IO.Path.Combine(normalized, "tesseract.exe");
                  if (File.Exists(normalized))
                      return System.IO.Path.GetFullPath(normalized);
              }

              throw new FileNotFoundException("Tesseract OCR не найден.");
          }
          '@

          $anchor = 'private static async Task<string> RunTesseractAsync'
          if ($text -notmatch [regex]::Escape($anchor)) {
            throw "RunTesseractAsync method was not found."
          }

          if ($text -notmatch 'private static string ResolveTesseractPath\(') {
            $text = $text.Replace($anchor, $helper.Trim() + [Environment]::NewLine + [Environment]::NewLine + $anchor)
          }

          $fileNamePattern = 'FileName\s*=\s*"tesseract"'
          if ($text -match $fileNamePattern) {
            $text = [regex]::Replace($text, $fileNamePattern, 'FileName = tesseractPath', 1)
          } elseif ($text -notmatch 'FileName\s*=\s*tesseractPath') {
            throw 'Tesseract FileName assignment was not found.'
          }

          if ($text -notmatch 'var tesseractPath\s*=\s*ResolveTesseractPath\(\)') {
            $text = $text.Replace('var startInfo = new ProcessStartInfo', 'var tesseractPath = ResolveTesseractPath();' + [Environment]::NewLine + '          var startInfo = new ProcessStartInfo', 1)
          }

          if ($text -notmatch 'WorkingDirectory\s*=\s*System\.IO\.Path\.GetDirectoryName\(tesseractPath\)') {
            $text = $text.Replace('FileName = tesseractPath,', 'FileName = tesseractPath,' + [Environment]::NewLine + '              WorkingDirectory = System.IO.Path.GetDirectoryName(tesseractPath) ?? AppContext.BaseDirectory,', 1)
          }

          $tessEnv = @'
          var tessdata = System.IO.Path.Combine(
              System.IO.Path.GetDirectoryName(tesseractPath) ?? AppContext.BaseDirectory, "tessdata");
          if (Directory.Exists(tessdata))
              startInfo.Environment["TESSDATA_PREFIX"] = tessdata;
          '@

          if ($text -notmatch 'startInfo\.Environment\["TESSDATA_PREFIX"\]') {
            $text = $text.Replace('          };' + [Environment]::NewLine + '          using var process', '          };' + [Environment]::NewLine + $tessEnv.TrimEnd() + [Environment]::NewLine + '          using var process', 1)
          }

          $text = $text -replace 'RunDiagnosticProcessAsync\("tesseract",', 'RunDiagnosticProcessAsync(ResolveTesseractPath(),'

          Set-Content $file $text -Encoding UTF8

          Set-Content VERSION '1.0.0-beta.4' -Encoding UTF8
          $csproj = 'PdfStudio\PdfStudio.csproj'
          $project = Get-Content $csproj -Raw
          if ($project -match '<Version>[^<]+</Version>') {
            $project = [regex]::Replace($project, '<Version>[^<]+</Version>', '<Version>1.0.0-beta.4</Version>', 1)
          } else {
            $project = $project.Replace('<PropertyGroup>', '<PropertyGroup>' + [Environment]::NewLine + '    <Version>1.0.0-beta.4</Version>', 1)
          }
          Set-Content $csproj $project -Encoding UTF8

      - name: Restore
        run: dotnet restore PdfStudio/PdfStudio.csproj --runtime win-x64

      - name: Publish self-contained single-file EXE
        run: >
          dotnet publish PdfStudio/PdfStudio.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish --no-restore

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract --version=5.5.3.20260724 -y --no-progress
          $ocr = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          if (-not (Test-Path (Join-Path $ocr 'tesseract.exe'))) { throw "Tesseract executable not found in $ocr" }
          New-Item -ItemType Directory -Path .\publish\ocr -Force | Out-Null
          Copy-Item "$ocr\*" .\publish\ocr -Recurse -Force
          $tessdata = '.\publish\ocr\tessdata'
          New-Item -ItemType Directory -Path $tessdata -Force | Out-Null
          foreach ($lang in @('eng','rus')) {
            $target = Join-Path $tessdata "$lang.traineddata"
            if (-not (Test-Path $target)) {
              Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/$lang.traineddata" -OutFile $target
            }
            if (-not (Test-Path $target)) { throw "$lang.traineddata is missing." }
          }

      - name: Automatic PDF self-test
        shell: pwsh
        run: |
          & .\publish\PDF-Studio-CSharp.exe --self-test-auto
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: OCR smoke test
        shell: pwsh
        run: |
          & .\publish\ocr\tesseract.exe --version
          & .\publish\ocr\tesseract.exe --list-langs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare installer source
        shell: pwsh
        run: |
          $iss = 'installer.iss'
          $text = Get-Content $iss -Raw
          if (-not $text.Contains('Source: "publish\ocr\*";')) {
            $needle = 'Source: "publish\{#MyAppExe}"; DestDir: "{app}"; Flags: ignoreversion'
            $replacement = $needle + [Environment]::NewLine + 'Source: "publish\ocr\*"; DestDir: "{app}\ocr"; Flags: ignoreversion recursesubdirs createallsubdirs'
            if (-not $text.Contains($needle)) { throw 'Installer EXE source line was not found.' }
            $text = $text.Replace($needle, $replacement)
            Set-Content $iss $text -Encoding UTF8
          }

      - name: Package application with bundled OCR
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $exe = "PDF-Studio-CSharp-$version-win-x64.exe"
          Move-Item .\publish\PDF-Studio-CSharp.exe ".\publish\$exe"
          Compress-Archive -Force -Path ".\publish\*" -DestinationPath ".\publish\PDF-Studio-CSharp-$version-win-x64.zip"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          & (Join-Path $pf86 'Inno Setup 6\ISCC.exe') "/DMyAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem .\publish -File | Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object { $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash; "$hash  $($_.Name)" } |
            Set-Content .\publish\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-CSharp-win-x64
          path: |
            publish/*.exe
            publish/*.zip
            publish/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

# Build pipeline verification trigger
